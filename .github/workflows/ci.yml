name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # tests import .ts files directly, which needs Node >= 22.18
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      # placeholders so the build can evaluate config; no real services are used
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-build-only-secret
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:packages
      - run: npm run build
